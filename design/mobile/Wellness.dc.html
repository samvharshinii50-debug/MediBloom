<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;600;700;800;900&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .app { font-family: 'Nunito', system-ui, sans-serif; }
    .serif { font-family: 'DM Serif Display', Georgia, serif; }
    ::-webkit-scrollbar { display: none; }
  </style>
</helmet>

<div class="app" style="width:390px; height:844px; background:#FDF8F6; position:relative; overflow:hidden; display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; gap:12px; padding:18px 20px 14px 20px;">
    <div style="width:34px; height:34px; border-radius:10px; background:#F6F2FB; display:flex; align-items:center; justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2D2438" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>
    <div class="serif" style="font-size:19px; color:#2D2438;">Your Wellness</div>
  </div>

  <div style="flex:1; overflow:auto; padding:0 20px 20px 20px;">

    <div style="background:#FFFFFF; border-radius:18px; padding:16px; border:1px solid #F3EDF8; margin-bottom:14px;">

      <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid #F6F2FB;">

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E85D8A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"></polyline></svg>
          <span style="font-size:11.5px; font-weight:800; color:#2D2438;">Adherence</span>
        </div>
        <div style="display:flex; gap:4px; flex:1; justify-content:center;">
          <div style="width:16px; height:16px; border-radius:5px; background:#8FD4B8;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#8FD4B8;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#F5C56B;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#8FD4B8;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#8FD4B8;"></div>
        </div>
        <span style="font-size:12px; font-weight:800; color:#2D2438;">91%</span>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid #F6F2FB;">
        <div style="display:flex; align-items:center; gap:7px; width:90px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B5FBF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="17" height="8" rx="2"></rect></svg>
          <span style="font-size:11.5px; font-weight:800; color:#2D2438;">Energy</span>
        </div>
        <div style="display:flex; gap:4px; flex:1; justify-content:center;">
          <div style="width:16px; height:16px; border-radius:5px; background:#8FD4B8;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#F5C56B;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#F5C56B;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#8FD4B8;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#8FD4B8;"></div>
        </div>
        <span style="font-size:10.5px; color:#A79FB0; font-weight:700;">dipped</span>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid #F6F2FB;">
        <div style="display:flex; align-items:center; gap:7px; width:90px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D4A574" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"></path></svg>

        </div>
        <div style="display:flex; gap:4px; flex:1; justify-content:center;">
          <div style="width:16px; height:16px; border-radius:5px; background:#F5C56B;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#8FD4B8;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#8FD4B8;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#8FD4B8;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#8FD4B8;"></div>
        </div>
        <span style="font-size:10.5px; color:#4EA37D; font-weight:700;">better</span>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 0 4px 0;">
        <div style="display:flex; align-items:center; gap:7px; width:90px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4EA37D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21c9 0 14-5 14-14a1 1 0 0 0-1-1C9 6 5 11 5 20a1 1 0 0 0 0 1z"></path></svg>
          <span style="font-size:11.5px; font-weight:800; color:#2D2438;">Symptom-free</span>
        </div>
        <div style="display:flex; gap:4px; flex:1; justify-content:center;">
          <div style="width:16px; height:16px; border-radius:5px; background:#EDE6F2;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#8FD4B8;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#8FD4B8;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#8FD4B8;"></div>
          <div style="width:16px; height:16px; border-radius:5px; background:#8FD4B8;"></div>
        </div>
        <span style="font-size:12px; font-weight:800; color:#2D2438;">5d</span>
      </div>

    </div>

    <div style="position:relative; border-radius:18px; padding:16px; overflow:hidden; background:linear-gradient(160deg,#F1EBF8 0%, #FCE8EE 100%); border:1px solid #F0E1EC;">
      <div style="display:flex; align-items:center; gap:7px; margin-bottom:8px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#8B5FBF" stroke="none"><path d="M12 3l1.5 5L19 9.5 13.5 11 12 16l-1.5-5L5 9.5 10.5 8 12 3z"></path></svg>
        <div style="font-size:10px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; color:#8B5FBF;">Wellness Insight</div>
      </div>
      <div class="serif" style="font-size:14px; font-style:italic; color:#2D2438; line-height:1.4;">"Energy dips line up with starting Metformin &mdash; usually settles in 2 weeks."</div>
    </div>

  </div>
