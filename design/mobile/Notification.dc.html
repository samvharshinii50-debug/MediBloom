<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;600;700;800;900&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .app { font-family: 'Nunito', system-ui, sans-serif; }
    .serif { font-family: 'DM Serif Display', Georgia, serif; }
  </style>
</helmet>

<div class="app" style="width:390px; height:844px; position:relative; overflow:hidden; background:linear-gradient(200deg,#E4CFE0 0%, #C9B6E4 35%, #8B7DB8 70%, #5D5A8C 100%);">

  <div style="position:absolute; top:80px; left:0; right:0; text-align:center;">
    <div class="serif" style="font-size:64px; color:white; line-height:1;">6:00</div>
    <div style="font-size:13px; color:rgba(255,255,255,0.85); font-weight:700; margin-top:6px;">Tuesday, March 4</div>
  </div>

  <!-- notification card -->
  <div style="position:absolute; top:230px; left:16px; right:16px; background:rgba(255,255,255,0.92); backdrop-filter:blur(20px); border-radius:20px; padding:16px; box-shadow:0 20px 50px rgba(30,20,50,0.35);">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
      <svg width="18" height="18" viewBox="0 0 40 40"><g transform="translate(20,20)"><ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#E85D8A" opacity="0.9"></ellipse><ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#F4A6C1" opacity="0.85" transform="rotate(60)"></ellipse><ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#8B5FBF" opacity="0.9" transform="rotate(120)"></ellipse><ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#C9B6E4" opacity="0.85" transform="rotate(180)"></ellipse><ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#D4A574" opacity="0.85" transform="rotate(240)"></ellipse><ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#E85D8A" opacity="0.8" transform="rotate(300)"></ellipse><circle cx="0" cy="0" r="6.5" fill="white"></circle><rect x="-4" y="-1.4" width="8" height="2.8" rx="1.4" fill="#8B5FBF" transform="rotate(45)"></rect></g></svg>
      <span style="font-size:11px; font-weight:800; color:#6B6377;">MediBloom</span>
      <span style="font-size:10.5px; color:#A79FB0; font-weight:600; margin-left:auto;">now</span>
    </div>
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
      <div style="width:36px; height:36px; border-radius:11px; background:#F1EBF8; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8B5FBF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" transform="rotate(45 12 12)"><rect x="3" y="9" width="18" height="6" rx="3"></rect><line x1="12" y1="9" x2="12" y2="15"></line></svg>
      </div>
      <div>
        <div style="font-size:14px; font-weight:800; color:#2D2438;">Time for Metformin &middot; 500 mg</div>
        <div style="font-size:11.5px; color:#8A7F94; font-weight:600;">Scheduled for 1:00 PM</div>
      </div>
    </div>
    <div style="display:flex; gap:8px;">
      <div style="flex:1.2; text-align:center; background:linear-gradient(135deg,#E85D8A,#8B5FBF); color:white; font-weight:800; font-size:12px; padding:9px 0; border-radius:11px;">Mark Taken</div>
      <div style="flex:1; text-align:center; background:#F6F2FB; color:#6B6377; font-weight:700; font-size:12px; padding:9px 0; border-radius:11px;">Snooze</div>
      <div style="flex:0.8; text-align:center; color:#A79FB0; font-weight:700; font-size:12px; padding:9px 0;">Skip</div>
    </div>
  </div>

  <div style="position:absolute; bottom:56px; left:0; right:0; text-align:center;">
    <div style="font-size:11px; color:rgba(255,255,255,0.75); font-weight:700;">A real Android notification &mdash; works even if MediBloom is closed</div>
  </div>

</div>
</x-dc>
</body>
</html>
