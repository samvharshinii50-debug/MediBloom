<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;600;700;800;900&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .app { font-family: 'Nunito', system-ui, sans-serif; }
    .serif { font-family: 'DM Serif Display', Georgia, serif; }
    input, select { font-family: 'Nunito', sans-serif; outline: none; }
    .field-label { font-size:11.5px; font-weight:800; color:#6B6377; margin-bottom:6px; display:block; }
    ::-webkit-scrollbar { display: none; }
  </style>
</helmet>

<div class="app" style="width:390px; height:844px; background:#FDF8F6; position:relative; overflow:hidden; display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; gap:12px; padding:18px 20px 14px 20px;">
    <div style="width:34px; height:34px; border-radius:10px; background:#F6F2FB; display:flex; align-items:center; justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2D2438" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>
    <div class="serif" style="font-size:19px; color:#2D2438;">Add a medicine</div>
  </div>

  <div style="flex:1; overflow:auto; padding:0 20px 20px 20px;">

    <div style="margin-bottom:14px; position:relative;">
      <label class="field-label">Medicine name</label>
      <input type="text" value="Ibuprofen" style="width:100%; padding:12px 14px; border-radius:13px; border:1.5px solid #EDE6F2; font-size:14px; color:#2D2438; background:#FBF9FC;">
    </div>

    <div style="display:grid; grid-template-columns:1.4fr 1fr; gap:10px; margin-bottom:14px;">
      <div>
        <label class="field-label">Dose</label>
        <input type="text" value="200" style="width:100%; padding:12px 14px; border-radius:13px; border:1.5px solid #EDE6F2; font-size:14px; color:#2D2438;">
      </div>
      <div>
        <label class="field-label">Unit</label>
        <select style="width:100%; padding:12px 14px; border-radius:13px; border:1.5px solid #EDE6F2; font-size:14px; color:#2D2438; background:white;">
          <option>mg</option>
        </select>
      </div>
    </div>

    <div style="margin-bottom:14px;">
      <label class="field-label">How often</label>
      <div style="display:flex; gap:7px; flex-wrap:wrap; margin-bottom:10px;">
        <div style="padding:8px 14px; border-radius:999px; background:#2D2438; color:white; font-size:12px; font-weight:700;">Once daily</div>
        <div style="padding:8px 14px; border-radius:999px; background:#F6F2FB; color:#6B6377; font-size:12px; font-weight:700;">Twice daily</div>
        <div style="padding:8px 14px; border-radius:999px; background:#F6F2FB; color:#6B6377; font-size:12px; font-weight:700;">Custom</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px; background:#FBF9FC; border-radius:13px; padding:9px 13px; width:fit-content;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B5FBF" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 16 14"></polyline></svg>
        <span style="font-size:12.5px; color:#2D2438; font-weight:700;">6:00 PM</span>
      </div>
    </div>

    <div style="margin-bottom:14px;">
      <label class="field-label">Color tag</label>
      <div style="display:flex; gap:10px;">
        <div style="width:26px; height:26px; border-radius:50%; background:#E85D8A; box-shadow:0 0 0 2px white, 0 0 0 4px #E85D8A;"></div>
        <div style="width:26px; height:26px; border-radius:50%; background:#8B5FBF;"></div>
        <div style="width:26px; height:26px; border-radius:50%; background:#F17C7C;"></div>
        <div style="width:26px; height:26px; border-radius:50%; background:#8FD4B8;"></div>
        <div style="width:26px; height:26px; border-radius:50%; background:#D4A574;"></div>
      </div>
    </div>

    <div style="margin-bottom:6px;">
      <label class="field-label">Notes <span style="color:#C7BFCF; font-weight:600;">(optional)</span></label>
      <textarea rows="2" placeholder="e.g. take with food" style="width:100%; padding:12px 14px; border-radius:13px; border:1.5px solid #EDE6F2; font-size:13.5px; color:#2D2438; resize:none;"></textarea>
    </div>

  </div>

  <div style="padding:14px 20px 24px 20px; border-top:1px solid #F0E9F5;">
    <button style="width:100%; border:none; background:linear-gradient(135deg,#E85D8A,#8B5FBF); color:white; font-family:'Nunito',sans-serif; font-weight:800; font-size:14.5px; padding:15px 0; border-radius:999px; box-shadow:0 10px 24px rgba(139,95,191,0.28);">Add medicine</button>
  </div>

</div>
</x-dc>
</body>
</html>
