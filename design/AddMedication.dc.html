<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;600;700;800;900&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .app { font-family: 'Nunito', system-ui, sans-serif; }
    .serif { font-family: 'DM Serif Display', Georgia, serif; }
    input, select, textarea { font-family: 'Nunito', sans-serif; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #C9B6E4 !important; box-shadow: 0 0 0 3px rgba(139,95,191,0.14); }
    .field-label { font-size:12.5px; font-weight:800; color:#6B6377; margin-bottom:7px; display:block; }
    .freq-chip { transition: all .15s ease; cursor:pointer; }
    .btn-primary:hover { filter: brightness(1.06); }
    .swatch { cursor:pointer; transition: transform .12s ease; }
    .swatch:hover { transform: scale(1.12); }
  </style>
</helmet>

<div class="app" style="width:1280px; height:900px; position:relative; background:#FDF8F6; overflow:hidden;">

  <div style="position:absolute; inset:0; background:#2D2438; opacity:0.35;"></div>
  <div style="position:absolute; inset:0; backdrop-filter:blur(3px);"></div>

  <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:620px; max-height:820px; background:#FFFFFF; border-radius:26px; box-shadow:0 30px 80px rgba(45,36,56,0.35); padding:34px 38px; overflow:auto;">

    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px;">
      <div class="serif" style="font-size:25px; color:#2D2438;">Add a medicine</div>
      <div style="width:32px; height:32px; border-radius:10px; background:#F6F2FB; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B6377" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
      </div>
    </div>
    <div style="font-size:13.5px; color:#A79FB0; margin-bottom:24px; font-weight:600;">We'll check it against everything else you take.</div>

    <div style="margin-bottom:18px; position:relative;">
      <label class="field-label">Medicine name</label>
      <input type="text" value="Ibup" style="width:100%; padding:13px 16px; border-radius:14px; border:1.5px solid #EDE6F2; font-size:14.5px; color:#2D2438; background:#FBF9FC;">
      <div style="position:absolute; top:64px; left:0; right:0; background:#FFFFFF; border:1px solid #F0E9F5; border-radius:14px; box-shadow:0 14px 32px rgba(45,36,56,0.12); overflow:hidden; z-index:2;">
        <div style="padding:12px 16px; display:flex; align-items:center; gap:10px; background:#FCE8EE;">
          <div style="width:26px; height:26px; border-radius:8px; background:#F4A6C1; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" transform="rotate(45 12 12)"><rect x="3" y="9" width="18" height="6" rx="3"></rect></svg>
          </div>
          <div style="font-size:13.5px; color:#2D2438; font-weight:600;"><strong>Ibuprofen</strong> <span style="color:#A79FB0;">&middot; generic</span></div>
        </div>
        <div style="padding:12px 16px; display:flex; align-items:center; gap:10px;">
          <div style="width:26px; height:26px; border-radius:8px; background:#F6F2FB; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8B5FBF" stroke-width="2" transform="rotate(45 12 12)"><rect x="3" y="9" width="18" height="6" rx="3"></rect></svg>
          </div>
          <div style="font-size:13.5px; color:#2D2438; font-weight:600;">Ibuprofen <span style="color:#A79FB0;">(Advil)</span></div>
        </div>
        <div style="padding:12px 16px; display:flex; align-items:center; gap:10px;">
          <div style="width:26px; height:26px; border-radius:8px; background:#F6F2FB; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8B5FBF" stroke-width="2" transform="rotate(45 12 12)"><rect x="3" y="9" width="18" height="6" rx="3"></rect></svg>
          </div>
          <div style="font-size:13.5px; color:#2D2438; font-weight:600;">Ibuprofen <span style="color:#A79FB0;">(Motrin)</span></div>
        </div>
      </div>
    </div>

    <div style="height:150px;"></div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin-bottom:18px;">
      <div>
        <label class="field-label">Dose</label>
        <input type="text" value="200" style="width:100%; padding:13px 16px; border-radius:14px; border:1.5px solid #EDE6F2; font-size:14.5px; color:#2D2438;">
      </div>
      <div>
        <label class="field-label">Unit</label>
        <select style="width:100%; padding:13px 16px; border-radius:14px; border:1.5px solid #EDE6F2; font-size:14.5px; color:#2D2438; background:white;">
          <option>mg</option><option>mcg</option><option>ml</option><option>IU</option>
        </select>
      </div>
    </div>

    <div style="margin-bottom:18px;">
      <label class="field-label">How often</label>
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <div class="freq-chip" style="padding:9px 16px; border-radius:999px; background:#2D2438; color:white; font-size:13px; font-weight:700;">Once a day</div>
        <div class="freq-chip" style="padding:9px 16px; border-radius:999px; background:#F6F2FB; color:#6B6377; font-size:13px; font-weight:700;">Twice a day</div>
        <div class="freq-chip" style="padding:9px 16px; border-radius:999px; background:#F6F2FB; color:#6B6377; font-size:13px; font-weight:700;">3x a day</div>
        <div class="freq-chip" style="padding:9px 16px; border-radius:999px; background:#F6F2FB; color:#6B6377; font-size:13px; font-weight:700;">Custom</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px; background:#FBF9FC; border-radius:14px; padding:10px 14px; width:fit-content;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B5FBF" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 16 14"></polyline></svg>
        <span style="font-size:13.5px; color:#2D2438; font-weight:700;">6:00 PM</span>
      </div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin-bottom:18px;">
      <div>
        <label class="field-label">Starting</label>
        <input type="text" value="Mar 4, 2026" style="width:100%; padding:13px 16px; border-radius:14px; border:1.5px solid #EDE6F2; font-size:14.5px; color:#2D2438;">
      </div>
      <div>
        <label class="field-label">Ending <span style="color:#C7BFCF; font-weight:600;">(optional)</span></label>
        <input type="text" placeholder="No end date" style="width:100%; padding:13px 16px; border-radius:14px; border:1.5px solid #EDE6F2; font-size:14.5px; color:#C7BFCF;">
      </div>
    </div>

    <div style="margin-bottom:18px;">
      <label class="field-label">Color tag</label>
      <div style="display:flex; gap:12px;">
        <div class="swatch" style="width:30px; height:30px; border-radius:50%; background:#E85D8A; box-shadow:0 0 0 3px white, 0 0 0 5px #E85D8A;"></div>
        <div class="swatch" style="width:30px; height:30px; border-radius:50%; background:#8B5FBF;"></div>
        <div class="swatch" style="width:30px; height:30px; border-radius:50%; background:#F17C7C;"></div>
        <div class="swatch" style="width:30px; height:30px; border-radius:50%; background:#8FD4B8;"></div>
        <div class="swatch" style="width:30px; height:30px; border-radius:50%; background:#D4A574;"></div>
        <div class="swatch" style="width:30px; height:30px; border-radius:50%; background:#F5C56B;"></div>
      </div>
    </div>

    <div style="margin-bottom:26px;">
      <label class="field-label">Notes <span style="color:#C7BFCF; font-weight:600;">(optional)</span></label>
      <textarea rows="2" placeholder="e.g. take with food" style="width:100%; padding:13px 16px; border-radius:14px; border:1.5px solid #EDE6F2; font-size:14px; color:#2D2438; resize:none;"></textarea>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px;">
      <button style="border:none; background:transparent; color:#6B6377; font-family:'Nunito',sans-serif; font-weight:800; font-size:14px; padding:13px 22px; border-radius:999px; cursor:pointer;">Cancel</button>
      <button class="btn-primary" style="border:none; background:linear-gradient(135deg,#E85D8A,#8B5FBF); color:white; font-family:'Nunito',sans-serif; font-weight:800; font-size:14px; padding:13px 26px; border-radius:999px; cursor:pointer; box-shadow:0 10px 24px rgba(139,95,191,0.28);">Add medicine</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
