<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;600;700;800;900&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .app { font-family: 'Nunito', system-ui, sans-serif; }
    .serif { font-family: 'DM Serif Display', Georgia, serif; }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-ghost:hover { background: #F6F2FB; }
  </style>
</helmet>

<div class="app" style="width:520px; height:340px; position:relative; background:linear-gradient(160deg,#EFE9F5 0%, #F7EFF2 60%, #FDF8F6 100%); overflow:hidden; border-radius:18px;">

  <div style="position:absolute; top:18px; left:22px; width:140px; height:10px; border-radius:5px; background:rgba(45,36,56,0.06);"></div>
  <div style="position:absolute; top:36px; left:22px; width:90px; height:10px; border-radius:5px; background:rgba(45,36,56,0.04);"></div>

  <div style="position:absolute; bottom:24px; right:24px; width:340px; background:rgba(255,255,255,0.72); backdrop-filter:blur(18px); border:1px solid rgba(255,255,255,0.8); border-radius:22px; padding:22px 22px 20px 22px; box-shadow:0 24px 60px rgba(45,36,56,0.22);">

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
      <svg width="26" height="26" viewBox="0 0 40 40" style="flex-shrink:0;">
        <g transform="translate(20,20)">
          <ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#E85D8A" opacity="0.9"></ellipse>
          <ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#F4A6C1" opacity="0.85" transform="rotate(60)"></ellipse>
          <ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#8B5FBF" opacity="0.9" transform="rotate(120)"></ellipse>
          <ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#C9B6E4" opacity="0.85" transform="rotate(180)"></ellipse>
          <ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#D4A574" opacity="0.85" transform="rotate(240)"></ellipse>
          <ellipse cx="0" cy="-10" rx="5.5" ry="10" fill="#E85D8A" opacity="0.8" transform="rotate(300)"></ellipse>
          <circle cx="0" cy="0" r="6.5" fill="white"></circle>
          <rect x="-4" y="-1.4" width="8" height="2.8" rx="1.4" fill="#8B5FBF" transform="rotate(45)"></rect>
        </g>
      </svg>
      <div>
        <div style="font-size:11px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; color:#8B5FBF;">MediBloom</div>
        <div style="font-size:12px; color:#8A7F94; font-weight:600;">Time for your medicine</div>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:12px; margin-bottom:18px;">
      <div style="width:44px; height:44px; border-radius:13px; background:#F1EBF8; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8B5FBF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" transform="rotate(45 12 12)"><rect x="3" y="9" width="18" height="6" rx="3"></rect><line x1="12" y1="9" x2="12" y2="15"></line></svg>
      </div>
      <div>
        <div class="serif" style="font-size:19px; color:#2D2438;">Metformin &middot; 500 mg</div>
        <div style="font-size:12.5px; color:#8A7F94; margin-top:1px; font-weight:600;">Scheduled for 1:00 PM</div>
      </div>
    </div>

    <div style="display:flex; gap:8px;">
      <button class="btn-primary" style="flex:1.3; border:none; background:linear-gradient(135deg,#E85D8A,#8B5FBF); color:white; font-family:'Nunito',sans-serif; font-weight:800; font-size:13px; padding:11px 0; border-radius:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"></polyline></svg>
        Mark taken
      </button>
      <button class="btn-ghost" style="flex:1; border:1.5px solid #EDE6F2; background:white; color:#6B6377; font-family:'Nunito',sans-serif; font-weight:700; font-size:12.5px; padding:11px 0; border-radius:14px; cursor:pointer;">Snooze 10m</button>
      <button class="btn-ghost" style="flex:0.7; border:none; background:transparent; color:#A79FB0; font-family:'Nunito',sans-serif; font-weight:700; font-size:12.5px; border-radius:14px; cursor:pointer;">Skip</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
