<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:wght@400;600;700;800;900&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .app { font-family: 'Nunito', system-ui, sans-serif; }
    .serif { font-family: 'DM Serif Display', Georgia, serif; }
    input { font-family: 'Nunito', sans-serif; outline: none; }
    input:focus { border-color:#C9B6E4 !important; box-shadow: 0 0 0 3px rgba(139,95,191,0.14); }
    .btn-primary:hover { filter: brightness(1.06); }
    .chip { cursor:pointer; transition: transform .12s ease, box-shadow .12s ease; }
    .chip:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(45,36,56,0.10); }
    .edit-btn { cursor:pointer; }
  </style>
</helmet>

<div class="app" style="width:1280px; height:960px; position:relative; background:#FDF8F6; overflow:hidden;">

  <div style="position:absolute; inset:0; background:#2D2438; opacity:0.35;"></div>
  <div style="position:absolute; inset:0; backdrop-filter:blur(3px);"></div>

  <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:700px; max-height:880px; background:#FFFFFF; border-radius:26px; box-shadow:0 30px 80px rgba(45,36,56,0.35); padding:32px 36px; overflow:auto;">

    <div style="display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px;">
      <div class="serif" style="font-size:25px; color:#2D2438;">Review what we found</div>
      <div style="width:32px; height:32px; border-radius:10px; background:#F6F2FB; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B6377" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
      </div>
    </div>
    <div style="font-size:13.5px; color:#A79FB0; margin-bottom:18px; font-weight:600;">We read this from your file &mdash; please check everything before saving.</div>

    <div style="display:flex; align-items:center; gap:10px; background:#F6F2FB; border-radius:14px; padding:12px 16px; margin-bottom:22px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B5FBF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
      <span style="font-size:13px; font-weight:700; color:#2D2438;">sample_prescription.pdf</span>
      <span style="font-size:12px; color:#A79FB0; font-weight:600;">&middot; 3 medicines found &middot; read fully offline</span>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:22px;">

      <!-- high confidence row -->
      <div style="border:1.5px solid #F0E9F5; border-radius:16px; padding:16px 18px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
          <div style="display:flex; align-items:center; gap:6px; background:#E8F7F0; color:#3F9270; font-size:11px; font-weight:800; padding:5px 11px; border-radius:999px;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#3F9270" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"></polyline></svg>
            Looks clear
          </div>
          <svg class="edit-btn" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A79FB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path></svg>
        </div>
        <div style="display:grid; grid-template-columns:2fr 1fr 1.4fr; gap:10px;">
          <input value="Amoxicillin" style="padding:10px 12px; border-radius:10px; border:1.5px solid #EDE6F2; font-size:13.5px; font-weight:700; color:#2D2438;">
          <input value="500 mg" style="padding:10px 12px; border-radius:10px; border:1.5px solid #EDE6F2; font-size:13.5px; color:#2D2438;">
          <input value="3 times daily" style="padding:10px 12px; border-radius:10px; border:1.5px solid #EDE6F2; font-size:13.5px; color:#2D2438;">
        </div>
      </div>

      <!-- high confidence row -->
      <div style="border:1.5px solid #F0E9F5; border-radius:16px; padding:16px 18px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
          <div style="display:flex; align-items:center; gap:6px; background:#E8F7F0; color:#3F9270; font-size:11px; font-weight:800; padding:5px 11px; border-radius:999px;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#3F9270" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"></polyline></svg>
            Looks clear
          </div>
          <svg class="edit-btn" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A79FB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path></svg>
        </div>
        <div style="display:grid; grid-template-columns:2fr 1fr 1.4fr; gap:10px;">
          <input value="Metformin" style="padding:10px 12px; border-radius:10px; border:1.5px solid #EDE6F2; font-size:13.5px; font-weight:700; color:#2D2438;">
          <input value="500 mg" style="padding:10px 12px; border-radius:10px; border:1.5px solid #EDE6F2; font-size:13.5px; color:#2D2438;">
          <input value="Twice daily" style="padding:10px 12px; border-radius:10px; border:1.5px solid #EDE6F2; font-size:13.5px; color:#2D2438;">
        </div>
      </div>

      <!-- low confidence row -->
      <div style="border:1.5px solid #F3DDA8; border-radius:16px; padding:16px 18px; background:#FFFDF8;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
          <div style="display:flex; align-items:center; gap:6px; background:#FDF3E2; color:#B08328; font-size:11px; font-weight:800; padding:5px 11px; border-radius:999px;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#B08328" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2 20h20L12 4z"></path><line x1="12" y1="10" x2="12" y2="14.5"></line></svg>
            Please check this
          </div>
          <svg class="edit-btn" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A79FB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path></svg>
        </div>
        <div style="display:grid; grid-template-columns:2fr 1fr 1.4fr; gap:10px; margin-bottom:12px;">
          <input value="Ator&#8202;&#8202;statin?" style="padding:10px 12px; border-radius:10px; border:1.5px solid #F3DDA8; font-size:13.5px; font-weight:700; color:#8A6A28; background:#FDF3E2;">
          <input value="20 mg" style="padding:10px 12px; border-radius:10px; border:1.5px solid #EDE6F2; font-size:13.5px; color:#2D2438;">
          <input value="Once daily" style="padding:10px 12px; border-radius:10px; border:1.5px solid #EDE6F2; font-size:13.5px; color:#2D2438;">
        </div>
        <div style="font-size:11.5px; color:#8A6A28; font-weight:700; margin-bottom:8px;">The handwriting was unclear here &mdash; did you mean:</div>
        <div style="display:flex; gap:8px;">
          <div class="chip" style="padding:7px 14px; border-radius:999px; background:#2D2438; color:white; font-size:12px; font-weight:700;">Atorvastatin</div>
          <div class="chip" style="padding:7px 14px; border-radius:999px; background:#F6F2FB; color:#6B6377; font-size:12px; font-weight:700;">Atenolol</div>
          <div class="chip" style="padding:7px 14px; border-radius:999px; background:#F6F2FB; color:#6B6377; font-size:12px; font-weight:700;">Let me type it</div>
        </div>
      </div>

    </div>

    <div style="display:flex; justify-content:flex-end; gap:10px;">
      <button style="border:none; background:transparent; color:#6B6377; font-family:'Nunito',sans-serif; font-weight:800; font-size:14px; padding:13px 22px; border-radius:999px; cursor:pointer;">Cancel</button>
      <button class="btn-primary" style="border:none; background:linear-gradient(135deg,#E85D8A,#8B5FBF); color:white; font-family:'Nunito',sans-serif; font-weight:800; font-size:14px; padding:13px 26px; border-radius:999px; cursor:pointer; box-shadow:0 10px 24px rgba(139,95,191,0.28);">Looks good, add these 3</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
